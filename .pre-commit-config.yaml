repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.1
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  -   repo: https://github.com/biomejs/pre-commit
      rev: "v0.1.0"  # Use the sha / tag you want to point at
      hooks:
      -   id: biome-check
          additional_dependencies: ["@biomejs/biome@1.4.1"]

  - repo: local
    hooks:
      - id: comment-length
        name: "Keep comments to two lines"
        entry: python3 scripts/check_comment_length.py
        language: system
        types_or: [python, vue, html, javascript, ts, css]

  # Whole-tree scans: too slow to justify per-commit, and they need node_modules,
  # so they run on push. Enable with: pre-commit install --hook-type pre-push
  - repo: local
    hooks:
      - id: jscpd
        name: "Run jscpd duplication check"
        entry: npm run --silent dupes
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(ls_shop/.*\.py|dashboard/src/.*\.(vue|ts|js))$

      - id: dashboard-typecheck
        name: "Run vue-tsc typecheck"
        entry: bash -c 'cd dashboard && npm run --silent typecheck'
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^dashboard/src/.*\.(vue|ts)$
